<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF Anonymizer</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>PDF Anonymizer</h1>
  <span id="root" class="muted"></span>
  <span id="env" class="env"></span>
</header>

<div id="toolbar">
  <button id="btnTree" class="mini" title="Show / hide the file tree">☰</button>
  <div id="folderInfo" class="muted">Select a folder in the tree (click a folder or a file).</div>
  <div class="spacer"></div>
  <span id="status" class="status"></span>
  <button id="btnScan" class="primary" disabled>1 · Scan &amp; draft config</button>
  <button id="btnRun" class="primary" disabled>2 · Anonymize folder</button>
  <button id="btnRunFile" disabled title="Anonymize only the selected file (↑ ↓ in the tree switch file)">Anonymize file</button>
</div>

<main>
  <section id="treePane" class="pane">
    <div class="pane-head">Files <button id="btnRefresh" class="mini" title="Reload tree">⟳</button></div>
    <div id="tree" class="pane-body"></div>
  </section>

  <div class="splitter" data-split="tree" title="Drag to resize · double-click to reset"></div>

  <section id="origPane" class="pane">
    <div class="pane-head tools">
      <div class="phead-title"><span>Original</span> <span id="origName" class="muted"></span></div>
      <div class="pane-tools">
        <div class="zoom">
          <button id="zoomOut" class="mini" title="Zoom out (wheel; Shift + wheel scrolls)">−</button>
          <button id="zoomFit" class="mini zoom-label" title="Fit page width">Fit</button>
          <button id="zoomIn" class="mini" title="Zoom in (wheel; Shift + wheel scrolls)">+</button>
        </div>
        <button id="btnChanges" class="mini" disabled title="Draw a rectangle around each replaced field, in both panes">Changes</button>
        <div class="seg viewmode" title="Viewer: the pages as images, both PDFs zoom and scroll together.&#10;PDF: the browser's own PDF viewer (text can be selected, copied, searched).">
          <button id="modeViewer" data-mode="viewer" class="on">Viewer</button><button id="modePdf" data-mode="pdf">PDF</button>
        </div>
      </div>
    </div>
    <div id="origView" class="pane-body viewer">
      <div id="origPages" class="pages"></div>
      <iframe id="origFrame" title="original pdf (browser viewer)"></iframe>
      <div id="origEmpty" class="empty">No file selected</div>
    </div>
  </section>


  <section id="anonPane" class="pane">
    <div class="pane-head tools">
      <div class="phead-title"><span>Anonymized</span> <span id="anonName" class="muted"></span></div>
      <div class="pane-tools">
        <button id="btnBox" class="mini" disabled title="Black box tool: draw on the page. Drag a box to move it, its handles to resize, Delete to remove it. Boxes are saved in the config (Manual data).">▭ Black box</button>
        <button id="btnApply" class="mini" disabled title="Regenerate the anonymized file with the black boxes changed since the last anonymization. Nothing is applied before this button.">Apply</button>
        <button id="btnReviewed" class="mini review" disabled title="Flag this anonymized file as checked by hand.&#10;Regenerating the file clears the flag.">Mark as reviewed</button>
      </div>
    </div>
    <div id="anonView" class="pane-body viewer">
      <div id="anonPages" class="pages"></div>
      <iframe id="anonFrame" title="anonymized pdf (browser viewer)"></iframe>
      <div id="anonEmpty" class="empty">Not generated yet</div>
    </div>
  </section>

  <div class="splitter" data-split="side" title="Drag to resize · double-click to reset"></div>

  <section id="sidePane" class="pane">
    <div class="tabs">
      <button class="tab active" data-tab="config">Config <span id="dirtyMark" class="dirty" hidden>●</span></button>
      <button class="tab" data-tab="recap">Recap</button>
      <button class="tab" data-tab="log">Log</button>
    </div>
    <div id="tab-config" class="tabbody">
      <div class="cfgbar">
        <div class="seg" title="Table: tick / edit the values. YAML: the config file itself.">
          <button data-view="table">Table</button><button data-view="yaml">YAML</button>
        </div>
        <input id="cfgSearch" type="search" placeholder="Search a value…" spellcheck="false">
      </div>
      <div id="cfgTable" class="cfgtable"></div>
      <textarea id="configText" spellcheck="false" disabled
        placeholder="No config for this folder yet.&#10;Click “1 · Scan &amp; draft config” to detect personal data and get suggested replacements."></textarea>
      <div id="configMsg" class="small"><button id="btnSave" class="mini" disabled title="Save the config (Ctrl+S)">Save</button> <span id="configMsgText"></span></div>
    </div>
    <div id="tab-recap" class="tabbody" hidden></div>
    <div id="tab-log" class="tabbody" hidden><pre id="logBox"></pre></div>
  </section>
</main>

<script src="/static/app.js"></script>
</body>
</html>
