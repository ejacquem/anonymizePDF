<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF Anonymizer</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>PDF Anonymizer</h1>
  <span id="root" class="muted"></span>
  <span id="env" class="env"></span>
  <button id="btnApp" class="mini" title="App settings">⚙ Settings</button>
</header>
<div id="appMenu" class="appmenu" hidden>
  <div class="appmenu-title">App settings <span class="muted small">kept in this browser</span></div>
  <label class="chk"><input type="checkbox" id="appPopup"> Pop-up messages (top centre)</label>
  <label class="chk"><input type="checkbox" id="appAutoZoom"> Zoom on the word when it is found (else only move to it)</label>
  <label class="chk">Pop-up duration <input type="number" id="appPopupSeconds" min="1" max="10" step="1" class="appnum"> s</label>
  <label class="chk">Changes frame border <input type="range" id="appChangesWidth" min="0" max="5" step="0.1">
    <span id="appChangesWidthVal" class="muted small"></span></label>
  <label class="chk"><input type="checkbox" id="appOcr"> OCR second pass when anonymizing (also on digital PDFs)</label>
  <label class="chk" title="Scans and pictures: the fake text gets the quality detected on the page (blur, grain, resolution). Below 0 it is made a little worse than detected, above 0 a little cleaner. 0 = as detected.">Fake text quality
    <input type="range" id="appQuality" min="-1" max="1" step="0.05"> <span id="appQualityVal" class="muted small"></span></label>
  <label class="chk" title="The limit of the slider above: the fake text is never made worse than this, whatever the slider says (at -1 there is no limit). Blurry copies stay readable.">Lowest fake text quality
    <input type="range" id="appQualityFloor" min="-1" max="0" step="0.05"> <span id="appQualityFloorVal" class="muted small"></span></label>
  <div class="appmenu-sub">OCR engine <select id="appOcrEngine"></select></div>
  <div class="appmenu-sub">Names models <div id="appModels" class="appmodels"></div></div>
</div>
<div id="toast" class="toast" hidden><span id="toastText"></span><button id="toastClose" class="mini" title="Close">✕</button></div>

<div id="toolbar">
  <button id="btnTree" class="mini" title="Show / hide the file tree">☰</button>
  <div id="folderInfo" class="muted">Select a folder in the tree (click a folder or a file).</div>
  <div class="spacer"></div>
  <button id="btnScan" class="primary" disabled>1 · Scan &amp; draft config</button>
  <button id="btnRun" class="primary" disabled>2 · Anonymize folder</button>
  <button id="btnBoth" disabled title="Scan the folder, then anonymize it, without reviewing the config in between">Scan &amp; anonymize</button>
  <button id="btnRunFile" disabled title="Anonymize only the selected file (↑ ↓ in the tree switch file)">Anonymize file</button>
  <button id="btnExport" disabled title="Download a ZIP of the REVIEWED anonymized files of the selected folder and of the folders below it (never the originals, the configs or the reports)">Export anonymized</button>
</div>

<main>
  <section id="treePane" class="pane">
    <div class="pane-head">Files <button id="btnRefresh" class="mini" title="Reload tree">⟳</button></div>
    <div id="tree" class="pane-body"></div>
  </section>

  <div class="splitter" data-split="tree" title="Drag to resize · double-click to reset"></div>

  <section id="origPane" class="pane">
    <div class="pane-head tools">
      <div class="phead-title"><span>Original</span> <span id="origName" class="muted"></span></div>
      <div class="pane-tools">
        <div class="zoom">
          <button id="zoomOut" class="mini" title="Zoom out (wheel; Shift + wheel scrolls)">−</button>
          <button id="zoomFit" class="mini zoom-label" title="Fit page width">Fit</button>
          <button id="zoomIn" class="mini" title="Zoom in (wheel; Shift + wheel scrolls)">+</button>
        </div>
        <button id="btnOcr" class="mini" disabled title="Treat this PDF as a scan: every page is read by OCR and rebuilt as an image, whatever its text layer says. For a digital PDF whose replaced text lands at the wrong place. Click again to go back. Then anonymize again.">As OCR</button>
        <button id="btnRotL" class="mini" disabled aria-label="Rotate left" title="Rotate the original PDF 90° counter-clockwise and SAVE it (the original file is changed). Then anonymize again.">⟲</button>
        <button id="btnRotR" class="mini" disabled aria-label="Rotate right" title="Rotate the original PDF 90° clockwise and SAVE it (the original file is changed). Then anonymize again.">⟳</button>
        <button id="btnTrace" class="mini" disabled>Trace</button>
        <button id="btnChanges" class="mini" disabled title="Frame each replaced field (orange) and each removed area (purple, dashed), in both panes">Changes</button>
        <div class="seg viewmode" title="Viewer: the pages as images, both PDFs zoom and scroll together.&#10;PDF: the browser's own PDF viewer (text can be selected, copied, searched).">
          <button id="modeViewer" data-mode="viewer" class="on">Viewer</button><button id="modePdf" data-mode="pdf">PDF</button>
        </div>
      </div>
    </div>
    <div id="origView" class="pane-body viewer">
      <div id="origPages" class="pages"></div>
      <iframe id="origFrame" title="original pdf (browser viewer)"></iframe>
      <div id="origEmpty" class="empty">No file selected</div>
    </div>
  </section>


  <section id="anonPane" class="pane">
    <div class="pane-head tools">
      <div class="phead-title"><span>Anonymized</span> <span id="anonName" class="muted"></span></div>
      <div class="pane-tools">
        <button id="btnBox" class="mini" disabled title="Black box tool: draw on the page. Drag a box to move it, its handles to resize, Delete to remove it. Boxes are saved in the config (Manual data).">▭ Black box</button>
        <button id="btnText" class="mini" disabled title="Text tool: draw a box on the page and type the text: it is written in the box, stretched to its size. Texts are saved in the config (Typed texts).">▤ Text</button>
        <button id="btnUndo" class="mini" disabled aria-label="Undo" title="Undo the last change of the black boxes / typed texts of this file (Ctrl+Z)">↶</button>
        <button id="btnRedo" class="mini" disabled aria-label="Redo" title="Redo what was undone (Ctrl+Y or Ctrl+Shift+Z)">↷</button>
        <button id="btnReviewed" class="mini review" disabled title="Flag this anonymized file as checked by hand.&#10;Regenerating the file clears the flag.">Mark as reviewed</button>
      </div>
    </div>
    <div id="anonView" class="pane-body viewer">
      <div id="anonPages" class="pages"></div>
      <iframe id="anonFrame" title="anonymized pdf (browser viewer)"></iframe>
      <div id="anonEmpty" class="empty">Not generated yet</div>
    </div>
  </section>

  <div class="splitter" data-split="side" title="Drag to resize · double-click to reset"></div>

  <section id="sidePane" class="pane">
    <div class="tabs">
      <button class="tab active" data-tab="config">Config <span id="dirtyMark" class="dirty" hidden>●</span></button>
      <button class="tab" data-tab="recap">Recap</button>
      <button class="tab" data-tab="log">Log</button>
    </div>
    <div id="tab-config" class="tabbody">
      <div class="cfgbar">
        <div class="seg" title="Table: tick / edit the values. YAML: the config file itself.">
          <button data-view="table">Table</button><button data-view="yaml">YAML</button>
        </div>
        <span class="searchbox"><input id="cfgSearch" type="search" placeholder="Search a value…" spellcheck="false">
          <button id="cfgSearchClear" type="button" title="Clear the search" aria-label="Clear the search" hidden>×</button></span>
      </div>
      <div id="cfgTable" class="cfgtable"></div>
      <textarea id="configText" spellcheck="false" disabled
        placeholder="No config for this folder yet.&#10;Click “1 · Scan &amp; draft config” to detect personal data and get suggested replacements."></textarea>
      <div id="configMsg" class="small"><button id="btnSave" class="mini" disabled title="Save the config (Ctrl+S)">Save</button> <span id="configMsgText"></span></div>
    </div>
    <div id="tab-recap" class="tabbody" hidden></div>
    <div id="tab-log" class="tabbody" hidden><pre id="logBox"></pre></div>
  </section>
</main>

<footer id="statusbar">
  <span id="status" class="status" role="status" aria-live="polite"></span>
  <div id="progress" class="progress" hidden>
    <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>
    <span id="progressText" class="progress-text"></span>
  </div>
</footer>

<script src="/static/app.js"></script>
</body>
</html>
