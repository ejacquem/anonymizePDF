# Example anon_config.yaml (the app writes one per client folder when you press "Scan & draft config").
# A real anon_config.yaml contains personal data: never commit it.

ocr_lang: "fra+eng"          # Tesseract languages, used for scanned PDFs
case_sensitive: false
match_case: true             # keep UPPER/lower case of the original text in the replacement
style:
  mode: replace              # replace = new text in place | blackbox = black box only
  digital_fill: none         # digital PDFs: none = keep the page background | white = white rectangle
blackout:                    # black boxes over what cannot be replaced by fake text
  photos: true               # identity photos (and the faded 'ghost' copy on passports / ID cards)
  photos_only_on_id_documents: true   # true: only on pages that look like a passport / ID card / permit
  signatures: true           # handwritten signatures next to a 'Signature' label
  qr_codes: true             # QR codes and other 2D barcodes
mrz: regenerate              # machine readable zone (passport, ID card): regenerate in the same format | keep

replacements:
  - {find: "Thomas Marchand", replace: "Alexis Beaumont", type: PERSON}
  - {find: "Marchand", replace: "Beaumont", type: PERSON}
  - {find: "06 12 34 56 78", replace: "06 26 43 15 49", type: PHONE}
  - {find: "Acme Corp", replace: "Zeta Inc"}
  # - {find: "30/09/2024", replace: "22/03/2025", type: DATE}   # commented = NOT replaced

# Optional regex rules (applied after 'replacements'):
regex:
  - pattern: '\bREF-\d{6}\b'
    replace: "REF-000000"
