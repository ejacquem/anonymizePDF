# Example config for 2_anonymize.py / 3_verify.py / 4_anonymize_scan.py
ocr_lang: "nld+fra+eng"        # Tesseract languages (scans + verify OCR)
# spacy_models: ["nl_core_news_md", "fr_core_news_md"]   # default: every installed one
case_sensitive: false

style:
  mode: replace                # replace = white box + replacement text | blackbox = black box only

# Everything the detectors find of these types gets replaced.
# Types: IBAN BIC EMAIL PHONE CREDIT_CARD BE_NATIONAL_NUMBER BE_VAT BE_STRUCTURED_COMM
#        STREET_ADDRESS POSTAL_CITY ACCOUNT_NUMBER DATE   |  names (needs spaCy): PERSON LOCATION ORG
auto:
  IBAN: "BE00 0000 0000 0000"
  EMAIL: "anonymous@example.com"
  PHONE: "+32 000 00 00 00"
  STREET_ADDRESS: "[ADDRESS]"
  POSTAL_CITY: "[POSTCODE CITY]"
  PERSON: "[PERSON_{n}]"       # {n} = same number for the same name within one document

# Exact strings: most reliable. Beat the auto detectors when both match the same text.
terms:
  "Jan Peeters": "[PERSON_1]"
  "Acme Corp": "[COMPANY]"

# Your own regex rules (e.g. internal reference numbers)
regex:
  - pattern: '\bREF-\d{6}\b'
    replace: "[REF]"
